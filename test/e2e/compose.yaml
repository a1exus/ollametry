name: ollametry-e2e

# A throwaway stack for local E2E tests (make e2e-hermetic): Ollama, otel-lgtm
# and ollametry built from this checkout, on one private network. Nothing is
# published to the host; the test runner joins the network. Short poll and
# export intervals keep the test fast.

services:
  ollama:
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && curl -fsS -o /dev/null http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 5s
      retries: 90

  ollametry:
    build:
      context: ../..
      args:
        VERSION: e2e
    image: ollametry:e2e
    pull_policy: build
    environment:
      OLLAMETRY_OLLAMA_URL: http://ollama:11434
      OLLAMETRY_POLL_INTERVAL: 1s
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy

volumes:
  models:
