name: Release

# Pushing a tag vX.Y.Z publishes ghcr.io/<owner>/ollametry for amd64 and
# arm64 with SBOM and provenance attestations, builds reproducible binary
# archives for macOS and Linux with provenance attestations, then creates a
# GitHub release carrying the archives and SHA256SUMS.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      packages: write # push to ghcr.io
      id-token: write # sign the provenance attestation (Sigstore OIDC)
      attestations: write # store the attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No QEMU: the Dockerfile cross-compiles on the build platform and the
      # target stage only copies the binary, so nothing runs emulated.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  binaries:
    name: Build binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
      id-token: write # sign the provenance attestation (Sigstore OIDC)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pinned golang image and flags as the container image; archives
      # are reproducible (tools/dist.sh).
      - name: make dist
        env:
          TAG: ${{ github.ref_name }}
        run: make dist VERSION="$TAG"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub release
    needs: [image, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Release notes are the tag's section of CHANGELOG.md (Keep a Changelog).
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error file=CHANGELOG.md::no section for [$version]; move Unreleased entries under it before tagging"
            exit 1
          fi
          printf '\n## Image\n\n    ghcr.io/%s:%s\n    %s\n' "$GITHUB_REPOSITORY" "$version" "$DIGEST" >> notes.md
          printf '\n## Binaries\n\nmacOS and Linux archives are attached. Verify a download before use:\n\n    sha256sum --check --ignore-missing SHA256SUMS\n    gh attestation verify ollametry_%s_<os>_<arch>.tar.gz -R %s\n' "$version" "$GITHUB_REPOSITORY" >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag dist/*.tar.gz dist/SHA256SUMS
