name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The legs are independent; running them in parallel bounds the wall time
    # by the slowest one instead of their sum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and scan
            target: ci-lint
          - name: Test
            target: cover
          - name: Fuzz
            target: fuzz
    env:
      # The Makefile runs every tool in a pinned container; pointing its
      # caches at directories lets actions/cache keep them between runs.
      CACHE_GOMOD: ${{ github.workspace }}/.cache/gomod
      CACHE_GOBUILD: ${{ github.workspace }}/.cache/gobuild
      CACHE_GOLANGCI: ${{ github.workspace }}/.cache/golangci
      FUZZTIME: 20s # short: catches parser regressions; long campaigns are local
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pull requests restore caches saved by main but never save their own,
      # which keeps the cache small and out of reach of untrusted branches.
      # Modules are shared by all legs; build and lint caches are per leg.
      - name: Restore Go module cache
        id: gomod
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gomod
          key: gomod-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: gomod-

      - name: Restore build and lint caches
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gobuild
            .cache/golangci
          key: build-${{ matrix.target }}-${{ hashFiles('go.sum', 'Makefile') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.target }}-${{ hashFiles('go.sum', 'Makefile') }}-
            build-${{ matrix.target }}-

      - name: make ${{ matrix.target }}
        run: make "$TARGET"

      - name: Upload coverage
        if: always() && matrix.target == 'cover'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

      - name: Save Go module cache
        if: github.event_name == 'push' && matrix.target == 'cover' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gomod
          key: ${{ steps.gomod.outputs.cache-primary-key }}

      - name: Save build and lint caches
        if: github.event_name == 'push' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/gobuild
            .cache/golangci
          key: ${{ steps.build.outputs.cache-primary-key }}

  image:
    name: Build and smoke-test image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No QEMU: the Dockerfile cross-compiles on the build platform and the
      # target stage only copies the binary, so nothing runs emulated.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ollametry:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha

      # No Ollama in CI: the proxy must still start, report live, and answer
      # 502 in Ollama's error shape.
      - name: Smoke test
        run: |
          docker run -d --name ollametry -p 127.0.0.1:11435:11435 \
            -e OLLAMETRY_OLLAMA_URL=http://127.0.0.1:1 -e OTEL_METRICS_EXPORTER=none \
            ollametry:ci
          for _ in $(seq 1 20); do docker exec ollametry /usr/local/bin/ollametry healthcheck && break; sleep 1; done
          docker exec ollametry /usr/local/bin/ollametry healthcheck
          code=$(curl -s -o body.json -w '%{http_code}' http://127.0.0.1:11435/api/tags)
          test "$code" = 502 && jq -e '.error' body.json
          docker run --rm ollametry:ci -help 2>&1 | grep -q -- '-ollama-url'

      - name: Container logs
        if: failure()
        run: docker logs ollametry

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
      pull-requests: write # post the summary comment on failure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
